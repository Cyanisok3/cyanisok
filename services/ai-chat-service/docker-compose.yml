services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatserver}
      MYSQL_USER: ${MYSQL_USER:-chatuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app_dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment: &app-environment
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-chatuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatserver}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-5}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_API_URL: ${AI_API_URL:-https://api.deepseek.com/chat/completions}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-10}
      AI_STREAM_IDLE_TIMEOUT_SECONDS: ${AI_STREAM_IDLE_TIMEOUT_SECONDS:-90}
      AI_WORKER_COUNT: ${AI_WORKER_COUNT:-4}
      AI_QUEUE_CAPACITY: ${AI_QUEUE_CAPACITY:-32}
      CHAT_CONTEXT_MESSAGES: ${CHAT_CONTEXT_MESSAGES:-40}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-200}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      IMAGE_RECOGNITION_ENABLED: ${IMAGE_RECOGNITION_ENABLED:-true}
      IMAGE_MODEL_PATH: ${IMAGE_MODEL_PATH:-/root/models/mobilenetv2/mobilenetv2-7.onnx}
      IMAGE_LABEL_PATH: ${IMAGE_LABEL_PATH:-/root/imagenet_classes.txt}
      HTTP_THREAD_COUNT: ${HTTP_THREAD_COUNT:-4}
      HTTP_PORT: 80
    volumes:
      - .:/workspace
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - dev

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *app-environment
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
