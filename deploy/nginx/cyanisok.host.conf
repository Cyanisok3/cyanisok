server {
    listen 80;
    listen [::]:80;
    server_name cyanisok.cn www.cyanisok.cn;

    location ^~ /.well-known/ {
        root /www/wwwroot/cyanisok.cn;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cyanisok.cn www.cyanisok.cn;

    ssl_certificate /home/ubuntu/cyanisok/cyanisok.cn_nginx/cyanisok.cn_bundle.crt;
    ssl_certificate_key /home/ubuntu/cyanisok/cyanisok.cn_nginx/cyanisok.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Real-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/cyanisok.cn.log;
    error_log /www/wwwlogs/cyanisok.cn.error.log;
}
